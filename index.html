<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Zhang Shenbei personal page: art & design, photography, contact information.">
  <title>Zhang Shenbei</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/selected-works.css">
</head>
<body>
  <div id="top-group">
    <div id="avatar-wrap" title="Retract and scroll to top" onclick="goTopAndRetract()">
      <img id="avatar" src="assets/img/avatar.png" alt="Profile avatar" decoding="async" loading="eager">
    </div>
    <nav aria-label="Primary">
      <a href="#about">About</a>
      <a href="#work">Works</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>

  <header data-bg="#62b7e6" data-bg-mid="#f7d2b2">
    <h1 class="fade-in">Hello, I am Zhang Shenbei<br>Welcome to My Page!</h1>
  </header>

  <main>
    <section id="about" data-bg="#fbc8bd">
      <h2 class="section-title fade-in">About Me</h2>
      <p class="fade-in">A man is mysterious, nothing has been written yet.</p>
      <div class="eyes-wrapper fade-in-eyes" aria-hidden="true">
        <object id="eyes-object" type="image/svg+xml" data="assets/img/eyes.svg"></object>
      </div>
    </section>

    <section id="work" data-bg="#f4f4f0" aria-labelledby="works-title">
      <h2 id="works-title" class="section-title fade-in">My Works</h2>

      <div class="works-canvas">
        <p class="works-orbit-title">Selected<br>Works</p>

        <a class="selected-work" data-category="graphic" data-work="g-qzl" href="https://zsbszzz.github.io/shenbei-works/works/g-qzl.html" aria-label="Qizhen Lake — Graphic Design">
          <span class="work-art"><img src="assets/img/works/g-qzl.jpg" alt="" width="900" height="636" loading="lazy" decoding="async"></span>
        </a>

        <a class="selected-work" data-category="illustration" data-work="i-cyf" href="https://zsbszzz.github.io/shenbei-works/works/i-cyf.html" aria-label="Cloudy Yunfeng — Illustration">
          <span class="work-art"><img src="assets/img/works/i-cyf.jpg" alt="" width="900" height="675" loading="lazy" decoding="async"></span>
        </a>

        <a class="selected-work" data-category="spatial" data-work="s-luminaire" href="https://zsbszzz.github.io/shenbei-works/works/s-luminaire.html" aria-label="Luminaire — Spatial Product">
          <span class="work-art"><img src="assets/img/works/s-luminaire/luminaire.png" alt="" width="436" height="900" loading="lazy" decoding="async"></span>
        </a>

        <a class="selected-work" data-category="photography" data-work="p-westlake" href="https://zsbszzz.github.io/shenbei-works/works/p-westlake.html" aria-label="West Lake Series — Photography">
          <span class="work-art work-photo-stack">
            <img src="assets/img/works/p-westlake/cover.jpg" alt="" width="900" height="472" loading="lazy" decoding="async">
            <img src="assets/img/works/p-westlake/2.jpg" alt="" width="900" height="610" loading="lazy" decoding="async">
            <img src="assets/img/works/p-westlake/3.jpg" alt="" width="900" height="600" loading="lazy" decoding="async">
            <img src="assets/img/works/p-westlake/4.jpg" alt="" width="900" height="600" loading="lazy" decoding="async">
          </span>
        </a>

        <a class="selected-work" data-category="experimental" data-work="e-silkie" href="https://zsbszzz.github.io/shenbei-works/works/e-silkie.html" aria-label="Silkie — Experimental &amp; Fun">
          <span class="work-art"><img src="assets/img/works/e-silkie.png" alt="" width="789" height="900" loading="lazy" decoding="async"></span>
        </a>

        <a class="selected-work" data-category="experimental" data-work="e-delta" href="https://zsbszzz.github.io/shenbei-works/works/e-delta.html" aria-label="Delta — Experimental &amp; Fun">
          <span class="work-art"><img src="assets/img/works/e-delta.png" alt="" width="900" height="599" loading="lazy" decoding="async"></span>
        </a>
      </div>

      <div class="works-footer">
        <a class="all-works-link" href="https://zsbszzz.github.io/shenbei-works/">Explore all works <span aria-hidden="true">↗</span></a>
      </div>
    </section>

    <section id="contact" data-bg="#9ad3bc">
      <h2 class="section-title fade-in">Contact</h2>
      <p class="fade-in">Email: shenbeizhang@gmail.com</p>
      <ul class="fade-in contact-list">
        <li>GitHub: <a href="https://github.com/zsbszzz" target="_blank" rel="noopener noreferrer">zsbszzz</a></li>
        <li>Instagram: <a href="https://instagram.com/zsbszzz" target="_blank" rel="noopener noreferrer">@zsbszzz</a></li>
        <li>小红书：<a href="https://www.xiaohongshu.com/user/profile/62b70da8000000001902ba2d" target="_blank" rel="noopener noreferrer">神杯神杯</a></li>
      </ul>
    </section>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
